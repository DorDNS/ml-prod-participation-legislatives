name: Staging

on:
  push:
    branches: [staging]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    env:
      IMAGE: polling-turnout:${{ github.sha }}
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MODEL_NAME: polling-station-turnout
      MODEL_ALIAS: champion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install smoke test dependencies
        run: pip install -r requirements.txt

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Run container
        run: |
          docker run -d --name app -p 8000:8000 \
            -e MLFLOW_TRACKING_URI \
            -e MLFLOW_TRACKING_USERNAME \
            -e MLFLOW_TRACKING_PASSWORD \
            -e MODEL_NAME \
            -e MODEL_ALIAS \
            "$IMAGE"

      - name: Smoke test
        run: python scripts/smoke_test.py --url http://localhost:8000 --expect-champion

      - name: Show container logs
        if: failure()
        run: docker logs app
