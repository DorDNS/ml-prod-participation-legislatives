name: CI

on:
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
        
  docker-build-and-smoke:
    runs-on: ubuntu-latest
    env:
      REGISTRY_DIR: ${{ runner.temp }}/test-registry
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Create a test model registry
        run: |
          python scripts/make_test_registry.py --path "$REGISTRY_DIR"
          chmod -R a+rX "$REGISTRY_DIR"
      - name: Build image
        run: docker build -t polling-turnout:${{ github.sha }} .
      - name: Run container with the test model
        run: |
          docker run -d --name app -p 8000:8000 \
            -v "$REGISTRY_DIR:$REGISTRY_DIR:ro" \
            -e MLFLOW_ALLOW_FILE_STORE=true \
            -e MLFLOW_TRACKING_URI="file://$REGISTRY_DIR" \
            polling-turnout:${{ github.sha }}
      - name: Smoke test
        run: python scripts/smoke_test.py --url http://localhost:8000 --expect-version 1
      - name: Show container logs
        if: failure()
        run: docker logs app
